<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veebipood</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <img src="icons/logo.png" alt="HansTech Logo" class="logo" />

    <div id="brand">
      <p class="tagline">
        Uuendused Hanstechist teieni – tehke jõuluostud kiirelt ja muretult!
      </p>
    </div>

    <nav id="main-nav">
      <button type="button" class="nav-btn" id="nav-home" aria-label="Avaleht">
        <img src="icons/home.png" class="nav-icon" alt="" />
      </button>

      <button type="button" class="nav-btn" id="nav-favorites" aria-label="Lemmikud">
        <img src="icons/favourite.png" class="nav-icon" alt="" />
      </button>

      <button type="button" class="nav-btn" id="nav-cart" aria-label="Ostukorv">
        <span class="cart-icon-wrap">
          <img src="icons/cart.png" class="nav-icon" alt="Ostukorv" />
          <span
            id="cart-count"
            class="cart-count"
            role="status"
            aria-label="Ostukorvis olevate toodete arv"
          >0</span>
        </span>
      </button>
    </nav>
  </header>

  <main id="app"></main>

  <script type="module" src="main.js"></script>
</body>
</html>
